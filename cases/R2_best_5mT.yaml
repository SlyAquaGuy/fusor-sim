# Best-estimate counterpart of R1: same operating point, plus the 3D grid kicks (azimuthal deflection by
# the real wire grid), which remove the 2D-RZ axis line. R1 stays the certification BOUND (kicks off):
# in the A/B of 2026-10-18 (runs R1_bound_5mT_20261017 vs R1_kicks_20261018, same seed) kicks lowered the
# peak neutron rate by 0.3 % (1.750e7 -> 1.744e7 n/s, about 3x the 0.1 % statistical error) and the hottest
# cathode latitude from 935 K to 778 K (angular peaking 2.66 -> 1.95). Use this case for source SHAPE
# (OpenMC geometry, pictures), R1 for the bounding numbers.
name: R2_best_5mT
description: 60 kV, 50 mA, 5 mTorr D2, gamma=1, reflection on, makeup anode, 3D grid kicks on
voltage: -60000
current: 0.05
pressure: 5.0
gamma: 1.0
reflection: "on"
makeup: anode
chamber_half_length: 0.144    # CONFIRM the real half-length
t_end: 4.0e-6
t_avg: 2.0e-6
grid_kicks: "on"
